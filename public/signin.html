<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="signin.css" />
    <title>Sign In | Sports Community</title>
  </head>
  <body>
    <main class="signin">
      <div class="signin__card">
        <a href="index.html" class="signin__logo">
          <img src="logoprimary.svg" alt="logo" />
        </a>
        <h2>Welcome back!</h2>
        <p>Sign in to find your people and play together.</p>

        <form id="signin-form">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" required />

          <button type="submit" class="btn btn__primary">SIGN IN</button>

          <p id="form-error" style="color: #b00020; text-align: center;"></p>
        </form>

        <p class="signin__footer">
          Don't have an account yet? <a href="signup.html">Sign up</a>
        </p>
        <a href="index.html" class="signin__back">← Back to home</a>
      </div>
    </main>

    <script>
      document.getElementById("signin-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const errorBox = document.getElementById("form-error");
        errorBox.textContent = "";

        try {
          const res = await fetch("/api/signin", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value,
              password: document.getElementById("password").value,
            }),
          });
          const data = await res.json();

          if (res.ok) window.location.href = "/activities.html";
          else errorBox.textContent = data.error;
        } catch (err) {
          errorBox.textContent = "Could not reach the server. Is it running?";
        }
      });
    </script>
  </body>
</html>
